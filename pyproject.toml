[project]
name = "bank-api"
version = "0.1.0"
description = "Fictitious banking API for learning and fun"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
]

[build-system]
requires = ["hatchling >= 1.16"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["./src/bank_api"]

[tool.uv]
managed = true

[dependency-groups]
dev = [
  {include-group = "lint"},
  {include-group = "test"},
  "mypy>=1.20.1"
]
lint = [
    "ruff>=0.15.11",
]
test = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py314"
fix = true
show-fixes = true
indent-width = 4
exclude = ["venv", ".venv", "env", ".env", "node_modules", "__pycache__"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "T201", "INP001"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN201", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
explicit_package_bases = true
